services:
  - type: web
    name: transrv
    env: docker
    autoDeploy: true
    plan: free
    # Dockerfile is auto-detected at repo root
    # Render injects PORT automatically; Dockerfile forwards it to Spring
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: LOGGING_FILE_NAME
        value: logs/application.log


