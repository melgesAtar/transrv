<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Chamados</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; color: #111; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .muted { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
    th { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
    .status { font-weight: 600; }
    .OPEN { color: #2563eb; }
    .CLOSED { color: #059669; }
    .CLOSED_WITHOUT_SOLUTION { color: #b45309; }
    .pill { padding: 2px 8px; border-radius: 9999px; background: #f3f4f6; font-size: 12px; }
  </style>
  <script>
    async function fetchSummary() {
      const res = await fetch('/dashboard/summary');
      return res.json();
    }

    function renderSummary(s) {
      document.getElementById('open').textContent = s.open;
      document.getElementById('closed').textContent = s.closed;
      document.getElementById('cws').textContent = s.closedWithoutSolution;
      document.getElementById('today').textContent = s.openedToday;

      const tbody = document.getElementById('recent');
      tbody.innerHTML = '';
      for (const t of s.recent || []) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>#${t.id}</td>
          <td>${t.waGroup?.groupName || '-'}</td>
          <td>${t.alertTerm?.code || '-'}</td>
          <td><span class="status ${t.status}">${t.status}</span></td>
          <td>Nível ${t.currentEscalationLevel ?? '-'}</td>
          <td>${t.createdAt?.replace('T',' ') || '-'}</td>
          <td>${t.closedAt?.replace('T',' ') || '-'}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function startStream() {
      const es = new EventSource('/dashboard/stream');
      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        renderSummary(data);
      });
      es.addEventListener('heartbeat', () => {});
      es.onerror = () => { es.close(); setTimeout(startStream, 3000); };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      renderSummary(await fetchSummary());
      startStream();
    });
  </script>
</head>
<body>
  <h1 style="margin-bottom:10px;">Acompanhamento de Chamados</h1>
  <div class="cards">
    <div class="card"><div class="muted">Abertos</div><div class="value" id="open">-</div></div>
    <div class="card"><div class="muted">Fechados</div><div class="value" id="closed">-</div></div>
    <div class="card"><div class="muted">Fechados s/ solução</div><div class="value" id="cws">-</div></div>
    <div class="card"><div class="muted">Abertos hoje</div><div class="value" id="today">-</div></div>
  </div>

  <div class="card">
    <div class="muted">Últimos 20</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Grupo</th>
          <th>Alerta</th>
          <th>Status</th>
          <th>Escalação</th>
          <th>Criado em</th>
          <th>Fechado em</th>
        </tr>
      </thead>
      <tbody id="recent"></tbody>
    </table>
  </div>
</body>
</html>
