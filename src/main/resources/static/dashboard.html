<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel - Chamados</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; color: #111; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .muted { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
    th { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
    .status { font-weight: 600; }
    .OPEN { color: #2563eb; }
    .CLOSED { color: #059669; }
    .CLOSED_WITHOUT_SOLUTION { color: #b45309; }
    .pill { padding: 2px 8px; border-radius: 9999px; background: #f3f4f6; font-size: 12px; }
    .sla { width: 120px; height: 8px; background: #eee; border-radius: 9999px; overflow: hidden; }
    .sla .fill { height: 100%; width: 0%; background: #facc15; transition: width .3s linear, background-color .3s linear; }
    .sla .fill.yellow { background: #facc15; }
    .sla .fill.orange { background: #fb923c; }
    .sla .fill.red { background: #ef4444; }
    .icon-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; }
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
    .modal.open { display: flex; }
    .modal-card { width: min(600px, 92vw); background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .modal-title { font-weight: 700; font-size: 16px; }
    .close-x { background: transparent; border: none; font-size: 20px; cursor: pointer; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { min-width: 960px; }
    @media (max-width: 640px) {
      th, td { padding: 8px 6px; }
      .value { font-size: 22px; }
    }
  </style>
  <script>
    async function fetchSummary() {
      const res = await fetch('/dashboard/summary');
      return res.json();
    }

    // Thresholds alinhados com TicketService: nível 2 em 1min, nível 3 em 2min
    const LEVEL2_SECONDS = 60;  // scheduleEscalation(..., 2, Duration.ofMinutes(1))
    const LEVEL3_SECONDS = 120; // scheduleEscalation(..., 3, Duration.ofMinutes(2))

    function normalizeToMs(value) {
      if (!value) return NaN;
      let s = String(value).trim();
      // trocar espaço por T
      s = s.replace(' ', 'T');
      // se tiver fração com >3 dígitos, truncar para milissegundos
      s = s.replace(/\.(\d{3})\d+/, '.$1');
      const ms = Date.parse(s);
      return isNaN(ms) ? NaN : ms;
    }

    function formatDuration(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const hh = hours.toString().padStart(2, '0');
      const mm = minutes.toString().padStart(2, '0');
      const ss = seconds.toString().padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function updateTimers() {
      const now = Date.now();
      const rows = document.querySelectorAll('#recent tr');
      rows.forEach(tr => {
        const createdMsAttr = tr.getAttribute('data-created-ms');
        const closedMsAttr = tr.getAttribute('data-closed-ms');
        const status = tr.getAttribute('data-status');
        const startMs = createdMsAttr ? Number(createdMsAttr) : NaN;
        const endMs = (status === 'OPEN' || !closedMsAttr) ? now : Number(closedMsAttr);
        if (isNaN(startMs)) return;
        const elapsedSec = Math.max(0, Math.floor((endMs - startMs) / 1000));

        const timerEl = tr.querySelector('.timer');
        if (timerEl) timerEl.textContent = formatDuration(elapsedSec);

        const fill = tr.querySelector('.sla .fill');
        if (fill) {
          const cap = LEVEL3_SECONDS; // 2 minutos até o nível 3
          const percent = Math.max(0, Math.min(100, (elapsedSec / cap) * 100));
          fill.style.width = percent + '%';
          fill.classList.remove('yellow','orange','red');
          if (elapsedSec < LEVEL2_SECONDS) {
            fill.classList.add('yellow');
          } else if (elapsedSec < LEVEL3_SECONDS) {
            fill.classList.add('orange');
          } else {
            fill.classList.add('red');
          }
          fill.title = `Nível 2 em ${Math.max(0, LEVEL2_SECONDS - Math.min(elapsedSec, LEVEL2_SECONDS))}s • Nível 3 em ${Math.max(0, LEVEL3_SECONDS - Math.min(elapsedSec, LEVEL3_SECONDS))}s`;
        }
      });
    }

    let timersIntervalId;

    function renderSummary(s) {
      document.getElementById('open').textContent = s.open;
      document.getElementById('closed').textContent = s.closed;
      document.getElementById('cws').textContent = s.closedWithoutSolution;
      // removido campo "abertos hoje" do dashboard

      const tbody = document.getElementById('recent');
      tbody.innerHTML = '';
      for (const t of (s.recent || [])) {
        const tr = document.createElement('tr');
        const createdMs = normalizeToMs(t.createdAt);
        const closedMs = normalizeToMs(t.closedAt);
        tr.setAttribute('data-status', t.status || '');
        if (!isNaN(createdMs)) tr.setAttribute('data-created-ms', String(createdMs));
        if (!isNaN(closedMs)) tr.setAttribute('data-closed-ms', String(closedMs));
        tr.innerHTML = `
          <td>#${t.id}</td>
          <td>${t.groupName || '-'}</td>
          <td>${t.alertCode || '-'}</td>
          <td><span class="status ${t.status}">${
            (t.status === 'OPEN') ? 'ABERTO' :
            (t.status === 'CLOSED') ? 'FECHADO' :
            (t.status === 'CLOSED_WITHOUT_SOLUTION') ? 'FECHADO S/ SOLUÇÃO' : (t.status || '-')
          }</span></td>
          <td>Nível ${t.currentEscalationLevel ?? '-'}</td>
          <td>${(t.createdAt || '').toString().replace('T',' ') || '-'}</td>
          <td>${(t.closedAt || '').toString().replace('T',' ') || '-'}</td>
          <td><span class="timer">-</span></td>
          <td>
            <button class="icon-btn msg-btn" title="Ver mensagem de abertura" aria-label="Mensagem de abertura">📨</button>
          </td>
          <td>
            ${t.status === 'OPEN' ? `<button class="pill close-ticket-btn" data-id="${t.id}">Fechar</button>` : '-'}
          </td>
          <td>
            <div class="sla"><div class="fill"></div></div>
          </td>
        `;
        tbody.appendChild(tr);
        // Guardar conteúdo da mensagem no botão para abrir modal
        const msgBtn = tr.querySelector('.msg-btn');
        if (msgBtn) {
          msgBtn.dataset.message = t.openingMessageContent || '';
          msgBtn.dataset.ticketId = t.id;
        }
      }

      updateTimers();
      if (!timersIntervalId) {
        timersIntervalId = setInterval(updateTimers, 1000);
      }
    }

    function startStream() {
      const es = new EventSource('/dashboard/stream');
      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        renderSummary(data);
      });
      es.addEventListener('heartbeat', () => {});
      es.onerror = () => { es.close(); setTimeout(startStream, 3000); };
    }

    function attachTableHandlers() {
      document.addEventListener('click', async (ev) => {
        const target = ev.target;
        if (target && target.classList && target.classList.contains('msg-btn')) {
          const content = target.dataset.message || '';
          const ticketId = target.dataset.ticketId || '';
          openModal(`Mensagem responsável pela abertura (#${ticketId})`, content || '(sem conteúdo)');
        }
        if (target && target.classList && target.classList.contains('close-ticket-btn')) {
          const id = target.getAttribute('data-id');
          if (!id) return;
          if (!confirm('Confirmar fechamento do chamado #' + id + '?')) return;
          try {
            const res = await fetch(`/dashboard/tickets/${id}/close`, { method: 'POST' });
            if (!res.ok && res.status !== 204) {
              alert('Falha ao fechar chamado #' + id);
            }
          } catch (e) {
            alert('Erro ao fechar chamado: ' + e.message);
          }
        }
      });
    }

    function openModal(title, content) {
      const modal = document.getElementById('msgModal');
      modal.classList.add('open');
      modal.querySelector('.modal-title').textContent = title;
      modal.querySelector('.modal-body').textContent = content;
    }
    function closeModal() {
      const modal = document.getElementById('msgModal');
      modal.classList.remove('open');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      renderSummary(await fetchSummary());
      startStream();
      attachTableHandlers();
    });
  </script>
</head>
<body>
  <h1 style="margin-bottom:10px;">Acompanhamento de Chamados</h1>
  <div class="cards">
    <div class="card"><div class="muted">Abertos (últimas 24h)</div><div class="value" id="open">-</div></div>
    <div class="card"><div class="muted">Fechados (últimas 24h)</div><div class="value" id="closed">-</div></div>
    <div class="card"><div class="muted">Fechados s/ solução (últimas 24h)</div><div class="value" id="cws">-</div></div>
  </div>

  <div class="card">
    <div class="muted">Últimos 20</div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Grupo</th>
          <th>Alerta</th>
          <th>Status</th>
          <th>Escalação</th>
          <th>Criado em</th>
          <th>Fechado em</th>
          <th>Tempo em aberto</th>
          <th>Msg abertura</th>
          <th>Ações</th>
          <th>SLA</th>
        </tr>
      </thead>
      <tbody id="recent"></tbody>
    </table>
    </div>
  </div>

  <div id="msgModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Mensagem responsável pela abertura</div>
        <button class="close-x" onclick="closeModal()" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body" style="white-space: pre-wrap; word-break: break-word;"></div>
      <div style="text-align: right; margin-top: 12px;">
        <button class="pill" onclick="closeModal()">Fechar</button>
      </div>
    </div>
  </div>
</body>
</html>
