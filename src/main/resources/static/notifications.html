<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel - Notificações</title>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png?v=1">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <link rel="icon" href="/favicon_io/favicon.ico?v=1" type="image/x-icon">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; color: #111; }
    .nav { display:flex; gap:12px; align-items:center; padding:10px 12px; border:1px solid #e5e7eb; border-radius: 10px; background:#fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); margin-bottom: 14px; }
    .nav a { text-decoration:none; color:#111; padding:6px 10px; border-radius:8px; }
    .nav a:hover { background:#f3f4f6; }
    .nav .brand { display:flex; align-items:center; gap:8px; font-weight:700; margin-right:auto; }
    .nav .external { color:#2563eb; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .muted { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
    th { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
    .pill { padding: 2px 8px; border-radius: 9999px; background: #f3f4f6; font-size: 12px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { min-width: 960px; }
  </style>
  <script>
    async function fetchNotifications() {
      const res = await fetch('/notifications');
      return res.json();
    }

    function render(list) {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      for (const n of (list || [])) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>#${n.id}</td>
          <td>#${n.ticketId ?? '-'}</td>
          <td>${n.groupName || '-'}</td>
          <td>${n.alertCode || '-'}</td>
          <td>${n.employeeName || '-'}</td>
          <td>${(Array.isArray(n.employeePhones) && n.employeePhones.length) ? n.employeePhones.join(', ') : '-'}</td>
          <td>Nível ${n.escalationLevel}</td>
          <td>${(n.notifiedAt || '').toString().replace('T',' ') || '-'}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function startStream() {
      const es = new EventSource('/notifications/stream');
      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        render(data);
      });
      es.addEventListener('heartbeat', () => {});
      es.onerror = () => { es.close(); setTimeout(startStream, 3000); };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      render(await fetchNotifications());
      startStream();
    });
  </script>
  </head>
<body>
  <div class="nav" role="navigation" aria-label="Navegação principal">
    <span class="brand"><img src="assets/logo-transrv-transparente.png?v=1" alt="TransRV" style="height:24px;"> TransRV</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="notifications" aria-current="page">Notificações</a>
    <a class="external" href="https://lookerstudio.google.com/reporting/75bac0ca-74ca-4f2b-9e7d-b83a6a9c3fd0" target="_blank" rel="noopener">Relatório (Looker Studio)</a>
  </div>
  <h1 style="margin-bottom:10px;">Acompanhamento de Notificações</h1>
  <div class="card">
    <div class="muted">Últimas 50 notificações</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Ticket</th>
            <th>Grupo</th>
            <th>Alerta</th>
            <th>Funcionário</th>
            <th>Telefone</th>
            <th>Escalação</th>
            <th>Notificado em</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
